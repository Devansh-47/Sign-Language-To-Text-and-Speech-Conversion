<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandSpeak.ai - Real-time Hand Sign Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }
        
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        #video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            border: 3px solid #667eea;
        }
        
        canvas {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: #667eea;
            color: white;
        }
        
        .btn-start:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-stop {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-stop:hover:not(:disabled) {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95em;
            text-align: center;
        }
        
        .status.idle {
            background: #e7f5ff;
            color: #1971c2;
        }
        
        .status.running {
            background: #d3f9d8;
            color: #2b8a3e;
        }
        
        .status.error {
            background: #ffe7e7;
            color: #a61e4d;
        }
        
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .result-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result-card h3 {
            color: #495057;
            font-size: 0.9em;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .result-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .confidence {
            margin-top: 10px;
            font-size: 0.9em;
            color: #6c757d;
        }
        
        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        .top-suggestions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #764ba2;
        }
        
        .top-suggestions h3 {
            color: #495057;
            font-size: 0.9em;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .suggestion-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .suggestion-item:last-child {
            border-bottom: none;
        }
        
        .suggestion-letter {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
        }
        
        .suggestion-conf {
            font-size: 0.85em;
            color: #6c757d;
        }
        
        .session-info {
            font-size: 0.85em;
            color: #6c757d;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .result-value {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖐️ HandSpeak.ai</h1>
            <p>Real-time Hand Sign Recognition</p>
        </div>
        
        <div class="content">
            <div class="video-section">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas"></canvas>
                
                <div class="controls">
                    <button id="startBtn" class="btn-start" onclick="startCapture()">Start Camera</button>
                    <button id="stopBtn" class="btn-stop" onclick="stopCapture()" disabled>Stop Camera</button>
                </div>
                
                <div id="status" class="status idle">Ready</div>
            </div>
            
            <div class="results-section">
                <div class="result-card">
                    <h3>Current Prediction</h3>
                    <div class="result-value" id="prediction">--</div>
                    <div class="confidence">
                        Confidence: <span id="confidenceValue">0%</span>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                
                <div class="top-suggestions">
                    <h3>Top Predictions</h3>
                    <div id="suggestions">
                        <div class="suggestion-item">
                            <span class="suggestion-letter">-</span>
                            <span class="suggestion-conf">-</span>
                        </div>
                    </div>
                </div>
                
                <div class="session-info">
                    <strong>Session ID:</strong> <span id="sessionId">Generating...</span><br>
                    <strong>FPS:</strong> <span id="fps">0</span><br>
                    <strong>Status:</strong> <span id="streamStatus">Waiting...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        let stream = null;
        let frameInterval = null;
        let sessionId = 'session_' + Date.now();
        let frameCount = 0;
        let fpsLastTime = Date.now();
        let isCapturing = false;
        
        document.getElementById('sessionId').textContent = sessionId;
        
        // Test API connection on load
        window.addEventListener('load', async () => {
            try {
                const resp = await fetch('/v1/health');
                if (resp.ok) {
                    updateStatus('API connected', 'running');
                } else {
                    updateStatus('API not responding', 'error');
                }
            } catch (err) {
                updateStatus('Cannot reach API: ' + err.message, 'error');
            }
        });
        
        async function startCapture() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    isCapturing = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    updateStatus('Camera started', 'running');
                    captureFrames();
                };
            } catch (err) {
                console.error('Camera error:', err);
                updateStatus('Camera access denied: ' + err.message, 'error');
            }
        }
        
        function stopCapture() {
            isCapturing = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (frameInterval) {
                clearInterval(frameInterval);
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            updateStatus('Camera stopped', 'idle');
            document.getElementById('streamStatus').textContent = 'Stopped';
        }
        
        function captureFrames() {
            frameInterval = setInterval(async () => {
                if (!isCapturing || !video.readyState === video.HAVE_ENOUGH_DATA) return;
                
                try {
                    // Draw current frame to canvas
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Convert canvas to blob and then to base64
                    canvas.toBlob(async (blob) => {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const base64 = reader.result.split(',')[1];
                            sendFrame(base64);
                        };
                        reader.readAsDataURL(blob);
                    }, 'image/jpeg', 0.8);
                    
                    frameCount++;
                    
                    // Update FPS every second
                    const now = Date.now();
                    if (now - fpsLastTime >= 1000) {
                        document.getElementById('fps').textContent = frameCount;
                        frameCount = 0;
                        fpsLastTime = now;
                    }
                } catch (err) {
                    console.error('Frame capture error:', err);
                }
            }, 66); // ~15 FPS
        }
        
        async function sendFrame(frameBase64) {
            if (!frameBase64 || frameBase64.length < 100) {
                console.warn('Invalid frame data');
                return;
            }
            
            try {
                const payload = {
                    session_id: sessionId,
                    frame_b64: frameBase64,
                    timestamp_ms: Date.now()
                };
                
                const response = await fetch('/v1/frame', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`HTTP ${response.status}:`, errorText);
                    if (response.status === 400) {
                        document.getElementById('streamStatus').textContent = 'No hand detected';
                    } else {
                        document.getElementById('streamStatus').textContent = `Error: ${response.status}`;
                    }
                    return;
                }
                
                const data = await response.json();
                if (data.prediction) {
                    updateResults(data.prediction);
                }
                document.getElementById('streamStatus').textContent = 'Active';
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('streamStatus').textContent = 'Error: ' + err.message;
            }
        }
        
        function updateResults(prediction) {
            // Update main prediction
            const letter = prediction.letter || '--';
            document.getElementById('prediction').textContent = letter;
            
            // Update confidence
            const confidence = Math.round((prediction.confidence || 0) * 100);
            document.getElementById('confidenceValue').textContent = confidence + '%';
            document.getElementById('confidenceFill').style.width = confidence + '%';
            
            // Update top suggestions
            const suggestions = prediction.top5 || [];
            const suggestionsHtml = suggestions.slice(0, 5).map(s => `
                <div class="suggestion-item">
                    <span class="suggestion-letter">${s.letter || '?'}</span>
                    <span class="suggestion-conf">${Math.round((s.confidence || 0) * 100)}%</span>
                </div>
            `).join('');
            
            document.getElementById('suggestions').innerHTML = suggestionsHtml || '<div class="suggestion-item"><span>No suggestions</span></div>';
        }
        
        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
    </script>
</body>
</html>
